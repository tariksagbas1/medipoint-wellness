<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sayfa bulunamadı · Medipoint Wellness</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <style>
      main {
        display: grid;
        place-content: center;
        justify-items: start;
        gap: 16px;
        min-height: 100dvh;
        padding: 24px var(--gutter);
        max-width: 560px;
        margin-inline: auto;
      }
      .code {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 1.125rem;
        color: var(--green-700);
      }
      h1 {
        font-family: var(--font-display);
        font-variation-settings: "opsz" 144;
        font-weight: 560;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--green-900);
      }
      p {
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Bu sayfa menüde yok.</h1>
      <p>Aradığınız bağlantı taşınmış ya da hiç var olmamış olabilir. Menüye dönüp oradan devam edin.</p>
      <a class="btn btn--primary" href="/">Menüye dön</a>
    </main>
  </body>
</html>
